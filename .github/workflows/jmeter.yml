# .github/workflows/jmeter.yml
# provided in class by Lauren, modified by Victoria with help of ChatGPT
name: Spring Boot CI manual run with DB emulator + profiling

on:
  # Manual trigger for profiling runs
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: false
        default: 'develop'

  # Automatically run only for PRs that affect relevant files and target main
  pull_request:
    paths:
      - 'profiling/**'                # JMeter test plans
      - '.github/workflows/jmeter.yml' # Workflow file itself
      - 'pom.xml'                      # Maven build changes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      # Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Install JMeter - this ensures we can generate the report with -e command
      - name: Install JMeter 5.6.3
        run: |
          JMETER_VERSION=5.6.3
          wget https://dlcdn.apache.org//jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz
          wget https://dlcdn.apache.org//jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz.sha512
          sha512sum -c apache-jmeter-$JMETER_VERSION.tgz.sha512
          tar -xzf apache-jmeter-$JMETER_VERSION.tgz
          mv apache-jmeter-$JMETER_VERSION /opt/jmeter
          /opt/jmeter/bin/jmeter --version

      - name: Add JMeter to PATH
        run: echo "/opt/jmeter/bin" >> $GITHUB_PATH

      # Start Firestore emulator
      - name: Start Firestore emulator
        run: |
          mkdir -p $HOME/.cache/firebase/emulators
          firebase emulators:start \
            --only firestore \
            --project qdog-6aca2 \
            --import $HOME/.cache/firebase/emulators \
            --export-on-exit $HOME/.cache/firebase/emulators &
          sleep 15

      # Build project without tests
      - name: Build project
        run: mvn -B clean package -DskipTests

      # Start Spring Boot app with emulator profile
      - name: Start Spring Boot server
        run: |
          mvn spring-boot:run -Dspring-boot.run.profiles=emulator &
          echo "Waiting for Spring Boot server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "Server is up!"
              break
            fi
            sleep 2
          done

      # Run JMeter profiler against emulator
      - name: Run JMeter profiler
        run: |
          rm -rf profiling/report
          rm profiling/results.jtl
          
          # Minimal logging to avoid posting TMI in logs
          export JVM_ARGS="-Dlog_level.jmeter=ERROR"

          # Run JMeter headless
          jmeter -n \
            -t profiling/API-Test-Plan.jmx \
            -l profiling/results.jtl \
            -e -o profiling/report

      # Upload JMeter report
      - name: Upload JMeter HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: profiling/report/