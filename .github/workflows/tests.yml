# this CI script was copied from ChatGPT, GPT-5 
name: Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      SPRING_PROFILES_ACTIVE: ci
      FIRESTORE_EMULATOR_HOST: localhost:8080
      SPRING_CLOUD_GCP_PROJECT_ID: qdog-6aca2
      CI: true

    steps:
      - uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      # Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Start Firestore emulator
      - name: Start Firestore emulator
        run: |
          mkdir -p $HOME/.cache/firebase/emulators
          firebase emulators:start \
            --only firestore \
            --project qdog-6aca2 \
            --import $HOME/.cache/firebase/emulators \
            --export-on-exit $HOME/.cache/firebase/emulators &
          sleep 15

      # Build project without tests
      - name: Build project
        run: mvn -B clean package -DskipTests

      # Run tests with CI profile
      - name: Run tests
        run: mvn test -Dspring.profiles.active=ci
