spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  application:
    name: backend

server:
  port: 3000
  compression:
    enabled: true
  error:
    include-message: always
  shutdown: "graceful"